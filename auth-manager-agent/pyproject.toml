[project]
name = "partner-access-agent"
version = "0.1.0"
description = "ADK agent reaching partner SaaS through Agent Identity Auth Manager"
requires-python = ">=3.12"
dependencies = [
    # ADK 2.x, same pins as ../mortgage-agent and as the requirements list in
    # ../shared/agent_deploy.py — one version everywhere. [mcp] is required since 2.0.
    "google-adk[a2a,agent-identity,mcp]==2.9.0",
    "google-cloud-aiplatform[agent_engines]>=2.1.0,<2.2.0",
    "opentelemetry-instrumentation-google-genai",
    "opentelemetry-instrumentation-grpc",
    "opentelemetry-instrumentation-fastapi",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
