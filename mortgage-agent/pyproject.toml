[project]
name = "mortgage-agent"
version = "0.1.0"
description = "ADK mortgage assistant agent with Agent Gateway MCP connections"
requires-python = ">=3.12"
dependencies = [
    # ADK 2.x. The [mcp] extra is required since 2.0 (the MCP SDK left the
    # core dependencies); [a2a,agent-identity] are what the agent_registry
    # integration imports. Pinned to the exact version the container installs
    # via ../shared/agent_deploy.py's PINS — keep the two in step.
    "google-adk[a2a,agent-identity,mcp]==2.9.0",
    # The operator pickles the AdkApp with this SDK and the container unpickles
    # it with whatever ../shared/agent_deploy.py's PINS install, so both pin the
    # same range. Keep them aligned.
    "google-cloud-aiplatform[agent_engines]>=2.1.0,<2.2.0",
    "opentelemetry-instrumentation-google-genai",
    "opentelemetry-instrumentation-grpc",
    "opentelemetry-instrumentation-fastapi",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
